name: EAS Update (over-the-air)

# Ships the mobile JavaScript to phones without a store release.
#
# Trigger 1 — automatic: any push to main that touches the mobile app
#   publishes to the `production` update branch (the channel the
#   TestFlight / Play build listens on, per eas.json).
# Trigger 2 — manual: "Run workflow" in the Actions tab, pick the git
#   ref and the EAS branch (development for the dev-client build,
#   preview, or production). This is how a feature branch reaches a
#   phone before it's merged.
#
# Needs ONE secret, EXPO_TOKEN — either a repository secret or a secret
# on the "prod" environment (an Expo access token from expo.dev →
# Account settings → Access tokens). The token never appears
# in chat, in logs, or in a sandbox — only GitHub holds it, and it can
# be revoked from the same page.
#
# OTA only carries JavaScript. A change that adds a native module or
# edits app.json plugins needs a new EAS build instead — the update
# will simply not apply to a binary with a different runtimeVersion.

on:
  push:
    branches: [main]
    paths:
      - "artifacts/buildtogether/**"
      - ".github/workflows/eas-update.yml"
  workflow_dispatch:
    inputs:
      eas_branch:
        description: "EAS update branch (development | preview | production)"
        required: true
        default: "production"
        type: choice
        options: [development, preview, production]
      message:
        description: "Update message (shown in expo.dev)"
        required: false
        default: ""

# Only one publish at a time per channel; a newer push supersedes a
# queued older one rather than racing it to the phone.
concurrency:
  group: eas-update-${{ github.event.inputs.eas_branch || 'production' }}
  cancel-in-progress: true

jobs:
  # One job per GitHub environment the token might live in. A job can
  # only bind to one environment, and the token is only visible inside
  # the environment that holds it — so we try the likely names and let
  # whichever finds it publish. If both do, both publish the same bundle;
  # harmless. Repository-level secrets are visible to every job.
  publish:
    strategy:
      fail-fast: false
      matrix:
        gh_env: [prod, production]
    runs-on: ubuntu-latest
    environment: ${{ matrix.gh_env }}
    timeout-minutes: 15
    env:
      # Accept the common misnamings too — the value is the same secret.
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO_ACCESS_TOKEN || secrets.EAS_TOKEN || secrets.EXPOTOKEN }}
    steps:
      - name: Report what this job can see (names only, never values)
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          echo "GitHub environment bound: ${{ matrix.gh_env }}"
          echo "EXPO_TOKEN resolved: $([ -n "$EXPO_TOKEN" ] && echo yes\ \(${#EXPO_TOKEN} chars\) || echo NO)"
          echo "Checked secret names: EXPO_TOKEN, EXPO_ACCESS_TOKEN, EAS_TOKEN, EXPOTOKEN"
          echo "Repository/environment VARIABLES visible (not secrets): $(echo "$VARS_JSON" | tr -d '\n' | head -c 400)"
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning title=No token in environment '${{ matrix.gh_env }}'::Nothing named EXPO_TOKEN / EXPO_ACCESS_TOKEN / EAS_TOKEN / EXPOTOKEN is visible here. If you added it under Settings → Secrets and variables → Actions, make sure it is on the SECRETS tab (not Variables) and at Repository level. If it is on an Environment, its name must be 'prod' or 'production'."
          fi
      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.EXPO_TOKEN != ''
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
        if: env.EXPO_TOKEN != ''
      - name: Publish update
        if: env.EXPO_TOKEN != ''
        working-directory: artifacts/buildtogether
        env:
          EAS_BRANCH: ${{ github.event.inputs.eas_branch || 'production' }}
          MSG: ${{ github.event.inputs.message }}
        run: |
          eas update \
            --branch "$EAS_BRANCH" \
            --message "${MSG:-${GITHUB_REF_NAME}@${GITHUB_SHA::7}}" \
            --non-interactive
      - name: Fail if no job could publish
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::error title=EXPO_TOKEN not found in '${{ matrix.gh_env }}'::See the report step above for what was checked."
          exit 1
